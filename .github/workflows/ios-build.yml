name: iOS Build & Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    name: Build iOS Package
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: landingpage/package-lock.json

      - name: Install Web Dependencies
        working-directory: landingpage
        run: npm ci

      - name: Build Web Application
        working-directory: landingpage
        run: npm run build

      - name: Validate iOS Configuration
        run: |
          echo "Checking capacitor.config.json..."
          test -f landingpage/capacitor.config.json
          echo "Checking iOS Info.plist..."
          test -f landingpage/ios/App/App/Info.plist
          echo "iOS structure verified successfully!"
